          cat > src/main/java/com/zefari/client/MainGui.java <<'EOF'
          package com.zefari.client;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;
          import com.zefari.client.modules.Module;

          public class MainGui extends Screen {
              private int x = 60, y = 60, dragX, dragY;
              private String selectedCat = "Combat";
              public MainGui() { super(Text.literal("Zefari")); }

              @Override public void render(DrawContext ctx, int mx, int my, float delta) {
                  net.minecraft.client.MinecraftClient.getInstance().gameRenderer.renderBlur(delta); // Shader/Blur hissi
                  ctx.fill(0, 0, width, height, 0x66000000);
                  int w = 350, h = 250;
                  ctx.fill(x - 1, y - 1, x + w + 1, y + h + 1, 0xFF000000);
                  ctx.fill(x, y, x + w, y + h, 0xFF101015);
                  ctx.fill(x, y, x + w, y + 25, ZefariClient.themeColor.getRGB() | 0xFF000000);
                  ctx.drawText(textRenderer, "ZEFARI", x + 10, y + 8, 0xFFFFFFFF, true);
                  String[] cats = {"Combat", "Render", "Movement", "Misc", "Client"};
                  int cy = y + 35;
                  for (String c : cats) {
                      ctx.fill(x + 5, cy, x + 80, cy + 20, c.equals(selectedCat) ? 0xFF202025 : 0x00000000);
                      ctx.drawText(textRenderer, c, x + 10, cy + 6, c.equals(selectedCat) ? ZefariClient.themeColor.getRGB() : 0xFFAAAAAA, false);
                      cy += 22;
                  }
                  int myY = y + 35;
                  for (Module m : ZefariClient.modules) {
                      if (m.category.equals(selectedCat)) {
                          ctx.fill(x + 85, myY, x + w - 5, myY + 20, m.enabled ? (ZefariClient.themeColor.getRGB() & 0x00FFFFFF) | 0x44000000 : 0xFF15151A);
                          ctx.drawText(textRenderer, m.name, x + 90, myY + 6, m.enabled ? 0xFFFFFFFF : 0xFFAAAAAA, false);
                          int sy = myY + 22;
                          if (m.enabled) {
                              for (var s : m.settings) {
                                  if (s.isCheckbox) { ctx.drawText(textRenderer, s.name, x + 95, sy, 0xFFAAAAAA, false); ctx.fill(x + w - 25, sy, x + w - 15, sy + 10, s.boolValue ? ZefariClient.themeColor.getRGB() : 0xFF333333); sy += 12; }
                                  else if (s.modes != null) { ctx.drawText(textRenderer, s.name + ": " + s.modeValue, x + 95, sy, 0xFFAAAAAA, false); sy += 12; }
                                  else { ctx.drawText(textRenderer, s.name + ": " + String.format("%.1f", s.value), x + 95, sy, 0xFFAAAAAA, false); sy += 12; }
                              }
                          }
                          myY = sy + 5;
                      }
                  }
                  super.render(ctx, mx, my, delta);
              }
              @Override public boolean mouseClicked(double mx, double my, int b) {
                  if (b == 0) {
                      if (mx >= x && mx <= x + 350 && my >= y && my <= y + 25) { dragX = (int)mx - x; dragY = (int)my - y; return true; }
                      String[] cats = {"Combat", "Render", "Movement", "Misc", "Client"};
                      int cy = y + 35;
                      for (String c : cats) { if (mx >= x + 5 && mx <= x + 80 && my >= cy && my <= cy + 20) { selectedCat = c; return true; } cy += 22; }
                  }
                  return super.mouseClicked(mx, my, b);
              }
              @Override public boolean mouseDragged(double mx, double my, int b, double dx, double dy) { if (dragX > 0) { x = (int)mx - dragX; y = (int)my - dragY; return true; } return super.mouseDragged(mx, my, b, dx, dy); }
              @Override public boolean mouseReleased(double mx, double my, int b) { dragX = -1; return super.mouseReleased(mx, my, b); }
              @Override public boolean shouldPause() { return false; }
          }
          EOF

          cat > src/main/java/com/zefari/client/mixin/GameRendererMixin.java <<'EOF'
          package com.zefari.client.mixin;
          import com.zefari.client.ZefariClient;
          import net.minecraft.client.render.GameRenderer;
          import net.minecraft.client.render.Camera;
          import net.minecraft.client.render.Fog;
          import net.minecraft.client.render.FogShape;
          import org.joml.Vector4f;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(GameRenderer.class)
          public class GameRendererMixin {
              @Inject(method = "getFog", at = @At("RETURN"), cancellable = true)
              private void onGetFog(Camera camera, float viewDistance, boolean thickFog, float tickDelta, CallbackInfoReturnable<Fog> cir) {
                  var m = ZefariClient.modules.stream().filter(mod -> mod.name.equals("WorldTweaks") && mod.enabled).findFirst().orElse(null);
                  if (m != null) {
                      var c = ZefariClient.themeColor;
                      cir.setReturnValue(new Fog(new Vector4f(c.getRed()/255f, c.getGreen()/255f, c.getBlue()/255f, 1f), 0f, viewDistance, FogShape.SPHERE));
                  }
              }
          }
          EOF

          cat > src/main/java/com/zefari/client/mixin/HeldItemRendererMixin.java <<'EOF'
          package com.zefari.client.mixin;
          import com.zefari.client.ZefariClient;
          import net.minecraft.client.render.item.HeldItemRenderer;
          import net.minecraft.client.util.math.MatrixStack;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.SwordItem;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import net.minecraft.util.Hand;
          import net.minecraft.client.render.VertexConsumerProvider;

          @Mixin(HeldItemRenderer.class)
          public class HeldItemRendererMixin {
              @Inject(method = "renderFirstPersonItem", at = @At("HEAD"))
              private void onRenderItem(AbstractClientPlayerEntity player, float tickDelta, float pitch, Hand hand, float swingProgress, ItemStack item, float equipProgress, MatrixStack matrices, VertexConsumerProvider vertexConsumers, int light, CallbackInfo ci) {
                  var m = ZefariClient.modules.stream().filter(mod -> mod.name.equals("ItemFov") && mod.enabled).findFirst().orElse(null);
                  if (m != null && item.getItem() instanceof SwordItem) {
                      float scale = 1.0f + (m.settings.get(0).value / 100f);
                      matrices.scale(scale, scale, scale);
                      matrices.translate(0, 0, 0.5f);
                  }
              }
          }
          EOF
          
          cat > src/main/java/com/zefari/client/mixin/WorldRendererMixin.java <<'EOF'
          package com.zefari.client.mixin;
          import org.spongepowered.asm.mixin.Mixin;
          @Mixin(net.minecraft.client.render.WorldRenderer.class)
          public class WorldRendererMixin {}
          EOF

          find . -name "*.java" -exec sed -i 's/^          //' {} \;
          find . -name "*.gradle" -exec sed -i 's/^          //' {} \;
          find . -name "*.json" -exec sed -i 's/^          //' {} \;
          find . -name "*.frag" -exec sed -i 's/^          //' {} \;

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.11

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zefari-client-jar
          path: build/libs/*.jar
